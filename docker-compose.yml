name: lab-firewall

x-equipo: &equipo
  build: .
  image: lab-firewall:2026
  cap_add: [NET_ADMIN]
  init: true
  extra_hosts:
    - "pc-oficina:10.10.1.10"
    - "pc-ingenieria:10.10.1.20"
    - "srv-dmz:10.10.2.10"
    - "plc:10.10.3.10"
  depends_on: [fw]

services:
  fw:
    <<: *equipo
    depends_on: []
    hostname: fw
    command: ["fw"]
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ./reglas:/reglas
    networks:
      oficina: { ipv4_address: 10.10.1.254 }
      dmz:     { ipv4_address: 10.10.2.254 }
      planta:  { ipv4_address: 10.10.3.254 }

  pc-oficina:
    <<: *equipo
    hostname: pc-oficina
    command: ["cliente", "10.10.1.254"]
    networks:
      oficina: { ipv4_address: 10.10.1.10 }

  pc-ingenieria:
    <<: *equipo
    hostname: pc-ingenieria
    command: ["cliente", "10.10.1.254"]
    networks:
      oficina: { ipv4_address: 10.10.1.20 }

  srv-dmz:
    <<: *equipo
    hostname: srv-dmz
    command: ["servidor", "10.10.2.254"]
    networks:
      dmz: { ipv4_address: 10.10.2.10 }

  plc:
    <<: *equipo
    hostname: plc
    command: ["plc", "10.10.3.254"]
    networks:
      planta: { ipv4_address: 10.10.3.10 }

networks:
  # macvlan sin interfaz padre: cada red es un segmento aislado que no pasa por
  # el iptables del anfitrión (Docker 28+ descarta el tráfico enrutado entre puentes).
  oficina:
    driver: macvlan
    internal: true
    ipam: { config: [{ subnet: 10.10.1.0/24 }] }
  dmz:
    driver: macvlan
    internal: true
    ipam: { config: [{ subnet: 10.10.2.0/24 }] }
  planta:
    driver: macvlan
    internal: true
    ipam: { config: [{ subnet: 10.10.3.0/24 }] }
